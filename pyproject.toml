[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-suite"
version = "0.1.0"
description = "3 production MCP servers with auth, rate limits and docs — plumbing others build on."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lionel Sim", email = "lionel@theaicapitol.com"}]
keywords = ["mcp", "model-context-protocol", "servers", "tools"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mcp-suite = "mcp_server_suite.cli:main"

[project.urls]
Homepage = "https://github.com/lionelsimai/mcp-server-suite"
Repository = "https://github.com/lionelsimai/mcp-server-suite"
Issues = "https://github.com/lionelsimai/mcp-server-suite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
